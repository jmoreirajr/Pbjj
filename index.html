<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PB Jiu-Jitsu Community</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --orange:#FF6A00; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Oswald',Arial,sans-serif; }
  body { background:#000; color:#fff; }
  a { text-decoration:none; color:inherit; }

  nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:15px 40px; background:#000; border-bottom:1px solid #222;
  }
  .logo-wrap { display:flex; align-items:center; gap:12px; }
  .logo-wrap img {
    height:55px; width:55px; border-radius:50%; object-fit:cover; display:block;
  }
  .logo-wrap span {
    font-weight:600; font-size:17px; letter-spacing:0.5px; color:#fff;
  }
  nav ul { display:flex; gap:35px; list-style:none; }
  nav ul li a {
    font-size:14px; font-weight:500; letter-spacing:0.5px; color:#fff;
    transition:color .2s;
  }
  nav ul li a:hover { color:var(--orange); }

  .tagline {
    text-align:center; padding:10px 0; font-size:13px;
    letter-spacing:2px; color:#aaa; border-bottom:1px solid #222;
  }
  .tagline span { color:var(--orange); }

  .hero {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:100px 20px 120px; background:#000;
  }
  .hero h1 {
    font-size:56px; font-weight:700; margin-bottom:10px; color:#fff;
  }
  .hero h1 span { color:var(--orange); }
  .hero p.subtitle {
    font-size:20px; color:#ccc; margin-bottom:35px; letter-spacing:1px;
  }
  .hero-buttons { display:flex; gap:20px; }
  .btn {
    padding:14px 32px; border-radius:6px; font-weight:600; font-size:15px;
    letter-spacing:0.5px; cursor:pointer; transition:opacity .2s, transform .15s;
  }
  .btn:hover { opacity:0.85; transform:translateY(-2px); }
  .btn-primary { background:var(--orange); color:#000; border:none; }
  .btn-secondary { background:transparent; color:#fff; border:2px solid var(--orange); }

  footer {
    text-align:center; padding:25px; font-size:13px; color:#777;
    border-top:1px solid #222;
  }
</style>
</head>
<body>

  <nav>
    <div class="logo-wrap">
      <img src="logo.png" alt="PB Jiu-Jitsu Community Logo">
      <span>PB Jiu-Jitsu Community</span>
    </div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Schedule</a></li>
      <li><a href="#">Coaches</a></li>
      <li><a href="#">Membership</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="tagline">PACIFIC BEACH <span>·</span> SAN DIEGO</div>

  <section class="hero">
    <h1>PB Jiu-Jitsu <span>Community</span></h1>
    <p class="subtitle">De Brasil · Para o Mundo</p>
    <div class="hero-buttons">
      <button class="btn btn-primary">Join Now</button>
      <button class="btn btn-secondary">Schedule</button>
    </div>
  </section>

  <footer>
    &copy; 2026 PB Jiu-Jitsu Community. All rights reserved.
  </footer>

</body>
</html>
