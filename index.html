<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PB Jiu-Jitsu Community</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Helvetica Neue',Arial,sans-serif; }
  body { background:#000; color:#fff; }
  a { text-decoration:none; color:inherit; }

  nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:#000;
    border-bottom:1px solid #222;
  }
  nav .logo-wrap { display:flex; align-items:center; gap:12px; }
  nav .logo-wrap img { height:55px; }
  nav .logo-wrap span { font-weight:700; font-size:18px; letter-spacing:1px; }
  nav .cta-btn {
    background:#F5821F;
    color:#000;
    font-weight:700;
    padding:10px 24px;
    border-radius:6px;
    letter-spacing:1px;
  }
  nav .cta-btn:hover { background:#ff9a3d; }

  .hero {
    min-height:85vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
    background:radial-gradient(circle at center, #111 0%, #000 70%);
  }
  .hero img.hero-logo {
    height:160px;
    margin-bottom:30px;
  }
  .hero h1 {
    font-size:48px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:15px;
  }
  .hero p.subtitle {
    font-size:18px;
    color:#ccc;
    letter-spacing:2px;
    margin-bottom:35px;
    text-transform:uppercase;
  }
  .hero .cta-btn-big {
    background:#F5821F;
    color:#000;
    font-weight:800;
    font-size:18px;
    padding:16px 50px;
    border-radius:8px;
    letter-spacing:2px;
    display:inline-block;
  }
  .hero .cta-btn-big:hover { background:#ff9a3d; }

  footer {
    text-align:center;
    padding:25px;
    color:#666;
    font-size:13px;
    border-top:1px solid #222;
  }
</style>
</head>
<body>

<nav>
  <div class="logo-wrap">
    <img src="logo.png" alt="PB Jiu-Jitsu Community Logo">
    <span>PB JIU-JITSU COMMUNITY</span>
  </div>
  <a href="#join" class="cta-btn">JOIN NOW</a>
</nav>

<section class="hero">
  <img src="logo.png" alt="PB Jiu-Jitsu Community Logo" class="hero-logo">
  <h1>PB Jiu-Jitsu Community</h1>
  <p class="subtitle">De Brasil · Para o Mundo</p>
  <a href="#join" id="join" class="cta-btn-big">JOIN NOW</a>
</section>

<footer>
  &copy; 2026 PB Jiu-Jitsu Community. All rights reserved.
</footer>

</body>
</html>
