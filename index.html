<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PB Jiu-Jitsu Community</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --orange:#FF6A00; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Oswald',Arial,sans-serif; }
  body { background:#000; color:#fff; }
  a { text-decoration:none; color:inherit; }

  nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:15px 40px; background:#000; border-bottom:1px solid #222;
  }
  .logo-wrap { display:flex; align-items:center; gap:12px; }
  .logo-wrap img {
    height:55px; width:55px; border-radius:50%; object-fit:cover; display:block;
  }
  .logo-wrap span { font-weight:600; font-size:16px; letter-spacing:1px; }

  .btn {
    background:var(--orange);
    color:#fff;
    padding:12px 28px;
    border-radius:6px;
    font-weight:600;
    font-size:15px;
    letter-spacing:1px;
    border:none;
    cursor:pointer;
    display:inline-block;
  }
  .btn:hover { opacity:0.9; }

  .hero {
    min-height:80vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
  }
  .hero h1 {
    font-family:'Anton',sans-serif;
    font-size:64px;
    letter-spacing:2px;
    text-transform:uppercase;
    line-height:1.1;
    margin-bottom:20px;
  }
  .hero p {
    font-size:18px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#ccc;
    margin-bottom:35px;
  }

  footer {
    text-align:center;
    padding:25px;
    font-size:13px;
    color:#777;
    border-top:1px solid #222;
  }

  @media (max-width:600px){
    .hero h1 { font-size:38px; }
    nav { padding:15px 20px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="logo-wrap">
      <img src="logo.png" alt="PB Jiu-Jitsu Community Logo">
      <span>PB JIU-JITSU COMMUNITY</span>
    </div>
    <a href="#join" class="btn">JOIN NOW</a>
  </nav>

  <section class="hero">
    <h1>PB Jiu-Jitsu<br>Community</h1>
    <p>De Brasil · Para o Mundo</p>
    <a href="#join" class="btn">JOIN NOW</a>
  </section>

  <footer>
    &copy; 2026 PB Jiu-Jitsu Community. All rights reserved.
  </footer>

</body>
</html>
